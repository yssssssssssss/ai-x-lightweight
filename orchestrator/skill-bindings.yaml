version: 1
skills:
  - id: digital-human-competitive-analysis
    enabled: true
    task_types:
      - competitive_research
      - user_research_planning
    inputs:
      - business_domain
    input_requirements:
      - key: business_domain
        kind: value
        label: 研究业务领域
        description: 数字人竞品分析所处的业务领域和使用场景。
        required: true
        multiple: false
        acceptedSources:
          - conversation
        question: 本次数字人竞品分析面向哪个业务领域？
    required_tools:
      - tavily-web-search
      - ai-spider-search
      - experience-model-lab
      - virtual-user-lab
    risk_level: low
    composition:
      modes:
        - standalone
      supported_outcomes:
        - plan
        - answer
      compatible_deliverables:
        - competitive_analysis_report
        - research_plan
      required_input_roles:
        - business_domain
      optional_input_roles: []
      standalone_reason: Legacy composite payload and optional lab evidence have no deterministic Contribution mapping.
  - id: competitive-web-research
    enabled: true
    task_types:
      - competitive_research
      - industry_market_analysis
    inputs:
      - research_goal
    input_requirements:
      - key: research_goal
        kind: value
        label: 研究目标
        description: 本次 Web 竞品研究需要回答的问题、范围与决策目标。
        required: true
        multiple: false
        acceptedSources:
          - conversation
        question: 本次 Web 竞品研究需要回答什么问题？
      - key: public_evidence
        kind: value
        label: 竞品公开资料
        description: 用户指定或已保存的公开竞品资料。
        required: false
        multiple: true
        acceptedSources:
          - conversation
          - tool
        question: 是否有希望优先使用的竞品公开资料？
    required_tools:
      - tavily-web-search
    optional_tools:
      - playwright-page-capture
    risk_level: low
    composition:
      modes:
        - standalone
        - contributor
      supported_outcomes:
        - answer
      compatible_deliverables:
        - competitive_analysis_report
        - research_strategy_report
        - industry_market_analysis_report
      contribution_types:
        - market_landscape
        - competitive_analysis
      contribution_schema: schemas/research-contribution-v1.schema.json
      contribution_adapter: skill-envelope-provisional-v1
      required_input_roles:
        - research_goal
      optional_input_roles:
        - public_evidence
      shareable_prerequisites:
        - tavily-web-search
