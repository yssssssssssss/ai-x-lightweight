name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    if: github.repository == 'yssssssssssss/ai-x-lightweight'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      JWT_SECRET: release-verification-only
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm quality
      - run: pnpm build
      - run: node dist/database/run-migrations.js --dry-run
      - run: pnpm exec tsx --test tests/standalone-runtime.test.ts

  publish:
    if: github.repository == 'yssssssssssss/ai-x-lightweight'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yssssssssssss/ai-x-lightweight
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_BUILD_ID=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
