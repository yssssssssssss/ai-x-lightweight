name: Quality

on:
  pull_request:
  push:

jobs:
  playwright-contract:
    name: Playwright in-memory no-request contract
    runs-on: ubuntu-22.04
    env:
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
      PLAYWRIGHT_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run in-memory Chromium contracts
        run: >-
          pnpm exec tsx --test
          tests/playwright-page-capture-adapter.test.ts
          tests/editorial-report-renderer.test.ts
          tests/report-editorial-showcase-chromium.test.ts
          tests/standalone-html-report-chromium.test.ts

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: user_research_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_research_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/user_research_ai
      JWT_SECRET: ci-only-secret
      LLM_PROVIDER: mock
      TOOL_ADAPTER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm quality
      - run: pnpm build
      - run: node dist/database/run-migrations.js --dry-run
      - run: docker build --build-arg APP_BUILD_ID="$GITHUB_SHA" --tag ai-x-lightweight:ci .
      - name: Smoke standalone container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e LLM_PROVIDER=mock \
            -e LLM_MODEL_NAME=mock-llm \
            -e LLM_EXPECTED_ACTUAL_MODEL=mock-llm \
            -e TOOL_ADAPTER=fake \
            ai-x-lightweight:ci \
            node dist/database/run-migrations.js
          container_id="$(docker run -d --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e LLM_PROVIDER=mock \
            -e LLM_MODEL_NAME=mock-llm \
            -e LLM_EXPECTED_ACTUAL_MODEL=mock-llm \
            -e TOOL_ADAPTER=fake \
            ai-x-lightweight:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3001/api/healthz
          curl --fail --silent --show-error http://127.0.0.1:3001/ | grep -q '<div id="root"></div>'
